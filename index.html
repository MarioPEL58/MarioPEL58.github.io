<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarioPEL58 Portfolio</title>
    <style>
        /* Struttura base ad altezza intera */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; /* Sfondo scuro moderno */
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            text-align: center;
        }

        /* BARRA DI INTESTAZIONE: Contiene lingua e profilo senza sovrapposizioni */
        .header-bar {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between; /* Spinge la lingua a sinistra e il profilo a destra */
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        /* SELETTORE DI LINGUA */
        .lang-switch {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .lang-btn.active {
            color: #38bdf8; /* Azzurro attivo */
        }
        
        /* IMMAGINE PROFILO */
        .profile-img {
            width: 120px;          
            height: 120px;          
            border-radius: 30%;
            object-fit: cover;     
            border: 2px solid #38bdf8;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        /* CONTENITORE PRINCIPALE (Testi e Video) */
        .container {
            padding: 20px;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* VIDEO */
        .app-preview {
            width: 100%;
            max-width: 640px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            background-color: #1e293b;
        }

        /* PULSANTE AVVIO */
        .launch-btn {
            display: inline-block;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
            background-color: #7dd3fc;
        }

        .launch-btn:active {
            transform: translateY(-1px);
        }
        
        /* Ottimizzazione per Smartphone */
        @media (max-width: 600px) {
            .header-bar {
                flex-direction: column-reverse; /* Mette l'immagine sopra i pulsanti lingua */
                gap: 15px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    
    <!-- Nuova barra superiore che organizza gli elementi in modo sicuro -->
    <div class="header-bar">
        <div class="lang-switch">
            <button class="lang-btn active" onclick="setLanguage('it')">IT</button>
            <button class="lang-btn" onclick="setLanguage('en')">EN</button>
        </div>
        <img src="immagini/Pem_Image_canale.png" alt="Foto di MarioPEL58" class="profile-img">
    </div>

    <!-- Contenuto centrale -->
    <div class="container">
        <h1 data-it="Benvenuto nel mio spazio web" data-en="Welcome to my web space">Benvenuto nel mio spazio web</h1>
        
        <p data-it="Scopri come funziona la mia applicazione Python per la gestione del portafoglio" data-en="Discover how my Python portfolio management application works">Scopri come funziona la mia applicazione Python per la gestione del portafoglio</p>
        
        <video class="app-preview" autoplay loop muted playsinline controls preload="auto">
            <source src="video/Video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>

        <p data-it="Clicca sul pulsante qui sotto per avviarla ed inserire i tuoi dati" data-en="Click the button below to launch it and enter your data">Clicca sul pulsante qui sotto per avviarla ed inserire i tuoi dati</p>
        
        <a href="https://portfolio-app-7onxevmw2oxqpjxldpbqxg.streamlit.app/" target="_self" class="launch-btn" data-it="Avvia l'Applicazione 🚀" data-en="Launch Application 🚀">
            Avvia l'Applicazione 🚀
        </a>
    </div>

    <script>
        function setLanguage(lang) {
            document.querySelectorAll('[data-it]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + lang);
            });

            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(lang === 'it') {
                document.querySelector("button[onclick*='it']").classList.add('active');
            } else {
                document.querySelector("button[onclick*='en']").classList.add('active');
            }

            document.documentElement.lang = lang;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const userLang = navigator.language || navigator.userLanguage; 
            if (userLang.startsWith('en')) {
                setLanguage('en');
            } else {
                setLanguage('it');
            }
        });
    </script>
</body>
</html>
