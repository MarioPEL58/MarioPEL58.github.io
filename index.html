<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarioPEL58 Portfolio</title>
    <style>
        /* Centra tutto il contenuto verticalmente e orizzontalmente */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; /* Sfondo scuro moderno */
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* Stile del pulsante di lancio */
        .launch-btn {
            display: inline-block;
            background-color: #38bdf8; /* Colore azzurro Streamlit */
            color: #0f172a;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Effetto al passaggio del mouse */
        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
            background-color: #7dd3fc;
        }

        /* Effetto al click */
        .launch-btn:active {
            transform: translateY(-1px);
        }
        
        /* Gestione per smartphone: sposta l'immagine sopra il testo per non sovrapporsi */
        @media (max-width: 600px) {
            html, body {
                flex-direction: column;
                height: auto;
                padding: 40px 0;
            }
            .profile-img {
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    
    <!-- L'immagine ora usa il percorso esatto della tua cartella -->
    <img src="immagini/Pem_Image_canale.png" alt="Foto di MarioPEL58" class="profile-img">

    <div class="container">
        <h1>Benvenuto nel mio spazio web</h1>
        <p>Clicca sul pulsante qui sotto per avviare l'applicazione Python</p>
        
        <!-- target="_self" forza l'apertura NELLA STESSA SCHEDA del browser -->
        <!--a href="https://portfolio-app-zcfnqewa3mhbfswqwpx9bz.streamlit.app/" target="_self" class="launch-btn"-->
        <a href="https://portfolio-app-7onxevmw2oxqpjxldpbqxg.streamlit.app/" target="_self" class="launch-btn">
            Avvia l'Applicazione 🚀
        </a>
    </div>

</body>
</html>
