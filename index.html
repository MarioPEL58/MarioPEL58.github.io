<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarioPEL58 Portfolio</title>
    <style>
        /* Centra tutto il contenuto verticalmente e orizzontalmente */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; /* Sostituito height con min-height per gestire i contenuti lunghi */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; /* Sfondo scuro moderno */
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 800px; /* Evita che il contenuto si allarghi troppo su schermi grandi */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* SELETTORE DI LINGUA IN ALTO A SINISTRA */
        .lang-switch {
            position: absolute;
            top: 25px;
            left: 25px;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .lang-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .lang-btn.active {
            color: #38bdf8; /* Colore azzurro attivo */
        }
        
        /* IMMAGINE POSIZIONATA IN ALTO A DESTRA */
        .profile-img {
            position: absolute;    /* Blocca l'immagine in una posizione fissa */
            top: 20px;             /* Distanza dal bordo superiore */
            right: 20px;           /* Distanza dal bordo destro */
            width: 150px;          /* Ridotta a 150px: 360px occupava troppo spazio nell'angolo */
            height: 150px;          
            border-radius: 30%;    /* Taglio tondo */
            object-fit: cover;     
            border: 2px solid #38bdf8; /* Bordo azzurro coordinato */
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* STILE DEL VIDEO / ANTEPRIMA GIF */
        .app-preview {
            width: 100%;
            max-width: 640px; /* Dimensione ideale per mostrare l'app Streamlit */
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            background-color: #1e293b;
        }

        /* Stile del pulsante di lancio */
        .launch-btn {
            display: inline-block;
            background-color: #38bdf8; /* Colore azzurro Streamlit */
            color: #0f172a;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Effetto al passaggio del mouse */
        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
            background-color: #7dd3fc;
        }

        /* Effetto al click */
        .launch-btn:active {
            transform: translateY(-1px);
        }
        
        /* Gestione per smartphone: sposta l'immagine sopra il testo per non sovrapporsi */
        @media (max-width: 768px) {
            html, body {
                flex-direction: column;
                height: auto;
                padding: 80px 0 40px 0; /* Spazio extra in alto per non coprire il selettore lingua */
            }
            .profile-img {
                position: static;
                margin-bottom: 20px;
                width: 180px;
                height: 180px;
            }
            .lang-switch {
                top: 15px;
                left: 50%;
                transform: translateX(-50%); /* Centra i tasti lingua su schermi piccoli */
            }
        }
    </style>
</head>
<body>
    
    <!-- Selettore Lingua Interattivo -->
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('it')">IT</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <!-- L'immagine del profilo -->
    <img src="immagini/Pem_Image_canale.png" alt="Foto di MarioPEL58" class="profile-img">

    <div class="container">
        <!-- Testi mappati con i rispettivi attributi di traduzione -->
        <h1 data-it="Benvenuto nel mio spazio web" data-en="Welcome to my web space">Benvenuto nel mio spazio web</h1>
        
        <p data-it="Scopri come funziona la mia applicazione Python per la gestione del portafoglio" data-en="Discover how my Python portfolio management application works">Scopri come funziona la mia applicazione Python per la gestione del portafoglio</p>
        
        <!-- Video MP4 con caricamento automatico e muto forzato -->
        <video class="app-preview" autoplay loop muted playsinline controls preload="auto">
            <source src="video/Video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>

        <p data-it="Clicca sul pulsante qui sotto per avviarla ed inserire i tuoi dati" data-en="Click the button below to launch it and enter your data">Clicca sul pulsante qui sotto per avviarla ed inserire i tuoi dati</p>
        
        <a href="https://portfolio-app-7onxevmw2oxqpjxldpbqxg.streamlit.app/" target="_self" class="launch-btn" data-it="Avvia l'Applicazione 🚀" data-en="Launch Application 🚀">
            Avvia l'Applicazione 🚀
        </a>
    </div>

    <script>
        // Funzione logica per cambiare i testi dinamicamente
        function setLanguage(lang) {
            // Seleziona tutti gli elementi con l'attributo data-it
            document.querySelectorAll('[data-it]').forEach(el => {
                el.innerHTML = el.getAttribute('data-' + lang);
            });

            // Gestione estetica dei pulsanti attivo/inattivo
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(lang === 'it') {
                document.querySelector("button[onclick*='it']").classList.add('active');
            } else {
                document.querySelector("button[onclick*='en']").classList.add('active');
            }

            document.documentElement.lang = lang;
        }

        // Intercetta la lingua nativa del sistema dell'utente all'avvio
        window.addEventListener('DOMContentLoaded', () => {
            const userLang = navigator.language || navigator.userLanguage; 
            if (userLang.startsWith('en')) {
                setLanguage('en');
            } else {
                setLanguage('it'); // Impostazione predefinita in Italiano
            }
        });
    </script>
</body>
</html>
