<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarioPEL58 Portfolio</title>
    <style>
        /* Centra tutto il contenuto verticalmente e orizzontalmente */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh; /* Sostituito height con min-height per gestire i contenuti lunghi */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f172a; /* Sfondo scuro moderno */
            font-family: system-ui, -apple-system, sans-serif;
            color: #ffffff;
            text-align: center;
        }

        .container {
            padding: 40px 20px;
            max-width: 800px; /* Evita che il contenuto si allarghi troppo su schermi grandi */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* IMMAGINE POSIZIONATA IN ALTO A DESTRA */
        .profile-img {
            position: absolute;    /* Blocca l'immagine in una posizione fissa */
            top: 20px;             /* Distanza dal bordo superiore */
            right: 20px;           /* Distanza dal bordo destro */
            width: 150px;          /* Ridotta a 150px: 360px occupava troppo spazio nell'angolo */
            height: 150px;          
            border-radius: 30%;    /* Taglio tondo */
            object-fit: cover;     
            border: 2px solid #38bdf8; /* Bordo azzurro coordinato */
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: -0.05em;
        }

        p {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 25px;
        }

        /* STILE DEL VIDEO / ANTEPRIMA GIF */
        .app-preview {
            width: 100%;
            max-width: 640px; /* Dimensione ideale per mostrare l'app Streamlit */
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
            background-color: #1e293b;
        }

        /* Stile del pulsante di lancio */
        .launch-btn {
            display: inline-block;
            background-color: #38bdf8; /* Colore azzurro Streamlit */
            color: #0f172a;
            font-weight: 600;
            font-size: 1.2rem;
            padding: 16px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        /* Effetto al passaggio del mouse */
        .launch-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.4);
            background-color: #7dd3fc;
        }

        /* Effetto al click */
        .launch-btn:active {
            transform: translateY(-1px);
        }
        
        /* Gestione per smartphone: sposta l'immagine sopra il testo per non sovrapporsi */
        @media (max-width: 768px) {
            html, body {
                flex-direction: column;
                height: auto;
                padding: 40px 0;
            }
            .profile-img {
                position: static;
                margin-bottom: 20px;
                width: 180px;
                height: 180px;
            }
        }
    </style>
</head>
<body>
    
    <!-- L'immagine del profilo -->
    <img src="immagini/Pem_Image_canale.png" alt="Foto di MarioPEL58" class="profile-img">

    <div class="container">
        <h1>Benvenuto nel mio spazio web</h1>
        <p>Scopri come funziona la mia applicazione Python per la gestione del portafoglio</p>
        
        <!-- OPZIONE VIDEO MP4 (Consigliata) -->
        <!-- Sostituisci "video/demo.mp4" con il percorso esatto del tuo file video -->
        <video class="app-preview" autoplay loop muted playsinline controls preload="auto">
            <source src="video/Video.mp4" type="video/mp4">
            Il tuo browser non supporta i video HTML5.
        </video>

        <!-- OPZIONE GIF (Rimuovi i commenti sotto e cancella il tag <video> se preferisci la GIF) -->
        <!-- <img src="immagini/nome_della_tua_gif.gif" alt="Anteprima App" class="app-preview"> -->

        <p>Clicca sul pulsante qui sotto per avviarla ed inserire i tuoi dati</p>
        
        <a href="https://portfolio-app-7onxevmw2oxqpjxldpbqxg.streamlit.app/" target="_self" class="launch-btn">
            Avvia l'Applicazione 🚀
        </a>
    </div>

</body>
</html>
