<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Supabase Callback</title>
</head>
<body>

<script>

const hash = window.location.hash;

if (hash) {

    const params = new URLSearchParams(
        hash.substring(1)
    );

    const target =
        "https://portfolio-app-zcfnqewa3mhbfswqwpx9bz.streamlit.app/Login_&_Sign_Up?"
        + params.toString();

    window.location.replace(target);

}
else {

    document.body.innerHTML =
        "<h2>Nessun token ricevuto.</h2>";

}

</script>

</body>
</html>
